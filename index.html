
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#a9ddf9">

    <meta name="description"
        content="Bienvenido al mundo mágico de Miiaus Mágicos.">

    <title>Inicio | Miiaus Mágicos</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Roboto+Condensed:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS principal -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- CSS de música -->
    <link rel="stylesheet" href="css/musica.css">

    <!-- JavaScript principal -->
    <script src="js/main.js" defer></script>

</head>

<body>

    <main class="app-container">

        <!-- Fondo decorativo -->
        <div class="background"></div>

        <!-- Pantalla de bienvenida -->
        <section class="welcome-screen"
            aria-label="Pantalla de bienvenida">

            <!-- LOGO -->
            <div class="logo-container">

                <img
                    src="img/logo.png"
                    alt="Logo de Miiaus Mágicos"
                    class="main-logo"
                    draggable="false">

            </div>

            <!-- BOTÓN INGRESAR -->
            <div class="button-container">

                <a href="registro.html"
                    class="enter-button"
                    id="enterButton"
                    aria-label="Ingresar a la aplicación">

                    Ingresar!

                </a>

            </div>

            <!-- TEXTO SECUNDARIO -->
            <p class="welcome-text">
                Un mundo mágico te está esperando...
            </p>

        </section>

    </main>

    <!-- MÚSICA DE FONDO -->
    <audio
    id="backgroundMusic"
    src="audio/musica-fondo.mp3"
    loop
    preload="auto">
</audio>

<button
    class="music-button"
    id="musicButton"
    type="button"
    aria-label="Activar música"
    aria-pressed="false">

    <span id="musicIcon">♪</span>

</button>

<script src="js/musica.js"></script>


</body>
</html>
